[pytest]
testpaths = tests
addopts = -ra -q --tb=short -m "not slow"
markers =
    contract: API contract & schema drift — deterministic, run on every deploy
    functional: golden Q&A, grounding, multi-turn, language
    robustness: injection, authz, PII, handoff, edge inputs
    tickets: your approved Q&A from the spreadsheet, graded on meaning
    perf: latency & concurrency
    slow: excluded from the default run
